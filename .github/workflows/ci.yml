name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust Backend ───────────────────────────────────────────────────────
  rust-backend:
    name: Rust Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build backend
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-wingman-backend-${{ matrix.os }}
          path: |
            backend/target/release/hermes-wingman-backend
            backend/target/release/hermes-wingman-backend.exe
          if-no-files-found: ignore

  # ── Flutter Desktop ────────────────────────────────────────────────────
  flutter-build:
    name: Flutter ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Build Flutter ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release
          elif [ "${{ matrix.target }}" = "macos" ]; then
            flutter build macos --release
          elif [ "${{ matrix.target }}" = "windows" ]; then
            flutter build windows --release
          fi
        shell: bash

      - name: Upload Flutter artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-wingman-flutter-${{ matrix.target }}
          path: |
            build/linux/x64/release/bundle
            build/macos/Build/Products/Release
            build/windows/x64/runner/Release
          if-no-files-found: ignore

  # ── Rails Web ────────────────────────────────────────────────────────────
  rails-web:
    name: Rails Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes_wingman_web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: hermes_wingman_web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: hermes_wingman_web/yarn.lock

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run Brakeman
        run: bundle exec brakeman -q -w2

      - name: Run RuboCop
        run: bundle exec rubocop
