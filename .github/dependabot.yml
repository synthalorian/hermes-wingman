# Dependabot version updates run weekly (Mondays). Minor and patch updates are grouped into one
# pull request per ecosystem; major updates stay separate. Security updates are raised by
# Dependabot as usual and are not affected by these settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
